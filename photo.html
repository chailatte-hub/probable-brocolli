<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum of Chai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/museum.css">
<style>
  :root {
    --bg: #D4D9DA;
    --ink: #2B2E30;
    --name: #9DA4A7;
    --name-top: 36%;
    --plaque: #F3F4F2;
    --mat: #FBFBF8;
    --backdrop: rgba(226, 230, 231, .97);
    --frame-w: calc(var(--H) * .0065);
    --mat-w: calc(var(--H) * .016);
    /* light oak, like the frames in the photo */
    --frame-bg:
      repeating-linear-gradient(90deg, rgba(90,60,30,.07) 0 1px, transparent 1px 3px),
      linear-gradient(135deg, #C9A983, #A98660 45%, #9A7752 60%, #BE9C75);
    --frame-shadow:
      inset 0 0 0 1px rgba(255,255,255,.18),
      0 calc(var(--H) * .005) calc(var(--H) * .01) rgba(40,45,48,.20),
      0 calc(var(--H) * .018) calc(var(--H) * .04) rgba(40,45,48,.10);
  }
  /* the real gallery: wall and glossy floor from the photograph, repeated */
  .track {
    background: url("assets/gallery-wall.jpg") 0 0 / auto 100% repeat-x;
  }
  /* reflection in the polished floor */
  .frame {
    -webkit-box-reflect: below calc(var(--H) * var(--d) * 2)
      linear-gradient(to bottom, transparent 58%, rgba(255,255,255,.2));
  }
</style>
</head>
<body>
<div class="room" id="room" tabindex="0" aria-label="Museum of Chai. Scroll sideways to walk along the wall.">
  <div class="track" id="track"></div>
</div>

<dialog id="closeup" aria-label="Artwork up close">
  <button class="close" type="button" id="close">Close</button>
  <div class="closeup" id="closeup-body"></div>
</dialog>

<script src="assets/collection.js"></script>
<script src="assets/museum.js"></script>
<script>
  Museum({ centre: 0.36, floor: 0.536, gap: 0.12, lead: 0.32, tile: 868 / 696 });
</script>
</body>
</html>
