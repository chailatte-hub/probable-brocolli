<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum of Chai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/museum.css">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #000000;
    --name: #8C8C8C;
    --name-top: 42%;
    --plaque: #FFFFFF;
    --mat: #FFFFFF;
    --backdrop: rgba(255, 255, 255, .98);
    --frame-w: max(2px, calc(var(--H) * .0026));
    --mat-w: calc(var(--H) * .02);
    --frame-bg: #000000;
    --frame-shadow: none;
  }
  /* one thin line where wall meets floor; nothing else */
  .track {
    background: linear-gradient(to bottom, transparent calc(70% - .5px), #000 calc(70% - .5px), #000 calc(70% + .5px), transparent calc(70% + .5px));
  }
  .mat { box-shadow: none; }
  .canvas { box-shadow: none; }
  .frame::after { display: none; }
  .plaque { box-shadow: 0 0 0 1px #000; width: calc(var(--H) * .014); height: calc(var(--H) * .009); }
  /* on the wall the art is black and white; colour returns up close */
  .set .canvas > * { filter: grayscale(1) contrast(1.05); }
  .closeup .frame { --frame-w: 4px; }
</style>
</head>
<body>
<div class="room" id="room" tabindex="0" aria-label="Museum of Chai. Scroll sideways to walk along the wall.">
  <div class="track" id="track"></div>
</div>

<dialog id="closeup" aria-label="Artwork up close">
  <button class="close" type="button" id="close">Close</button>
  <div class="closeup" id="closeup-body"></div>
</dialog>

<script src="assets/collection.js"></script>
<script src="assets/museum.js"></script>
<script>
  Museum({ centre: 0.42, gap: 0.16, lead: 0.36 });
</script>
</body>
</html>
