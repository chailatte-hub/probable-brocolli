<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>archive</title>
<meta name="description" content="Archive, Museum of Chai">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/museum.css?v=1793342554">
<style>
  html, body { height: auto; overflow: auto; }
  body { background: #fff; }

  /* Tight masonry: columns filled in order, shortest first, so it reads newest to oldest */
  .grid {
    display: flex; align-items: flex-start;
    gap: var(--gap);
    padding: 24px 56px 64px;
  }
  /* Sizes are fixed in CSS pixels on purpose: browser zoom then changes how many columns fit,
     so zooming out shows smaller tiles and more of the archive at once */
  :root { --gap: 20px; }
  @media (max-width: 600px) { :root { --gap: 10px; } .grid { padding: 8px 16px 48px; } }
  .col { flex: 1; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  .tile {
    display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; background: #EEE;
    aspect-ratio: var(--ratio);
  }
  .tile > img, .tile > video {
    display: block; width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(1); transition: filter .4s ease;
  }
  .tile:hover > img, .tile:hover > video, .tile:focus-visible > img, .tile:focus-visible > video { filter: grayscale(0); }

  .tile { position: relative; }
  /* Navigation: hides while scrolling down, comes back on the first scroll up */
  .bar.fade {
    position: fixed; top: 0; left: 0; right: 0;
    padding-bottom: 40px;
    background: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,.96) 45%, rgba(255,255,255,0) 100%);
    transition: transform .35s ease, opacity .35s ease;
  }
  .bar.fade.away { transform: translateY(-100%); opacity: 0; }
  main { padding-top: 66px; }
  @media (prefers-reduced-motion: reduce) { .bar.fade { transition: none; } }
  .title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .title h1 a { color: inherit; text-decoration: none; }
  #tagchip { display: inline-flex; align-items: baseline; gap: 8px; font-size: 12px; min-width: 0; }
  #tagchip[hidden] { display: none; }
  #tagchip > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  #tagchip .slash { color: var(--soft); }
  #cleartag { border: 0; background: none; padding: 0 2px; font: inherit; font-size: 14px; line-height: 1; color: var(--soft); cursor: pointer; }
  #cleartag:hover { color: var(--ink); }
  .grid.tiny .count { display: none; }
  .tile .count {
    position: absolute; top: 8px; right: 8px;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(255,255,255,.88); color: var(--ink);
    font-size: 10px; letter-spacing: .04em; line-height: 1.2;
  }

  .empty { padding: 0 clamp(16px, 4vw, 56px); color: var(--soft); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) { .tile > img, .tile > video { transition: none; } }
</style>
</head>
<body>
<header class="bar fade" id="bar">
  <div class="title"><h1><a href="archive.html" id="home">Archive</a></h1><span id="tagchip" hidden></span></div>
  <nav class="tools" aria-label="Archive">
    <label class="year">
      <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filter by year</span>
      <select id="year"><option value="">All years</option></select>
    </label>
    <a href="./">Back to museum</a>
  </nav>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches that filter yet.</p>
</main>

<dialog id="closeup" aria-label="Artwork up close">
  <button class="close" type="button" id="close">Close</button>
  <div class="closeup" id="closeup-body"></div>
</dialog>

<script src="assets/collection.js?v=1793342554"></script>
<script src="assets/tumblr.js?v=1793342554"></script>
<script src="assets/viewer.js?v=1793342554"></script>
<script src="assets/guard.js?v=1793342554"></script>
<script>
(() => {
  const yearOf = p => (String(p.place || '').match(/\d{4}/) || [''])[0];
  const fromTumblr = (window.TUMBLR || []).map(t => ({
    place: t.place, note: t.note, tags: t.tags,
    slides: t.f.map((f, k) => ({ image: `assets/archive/full/${f}.jpg`, thumb: `assets/archive/thumb/${f}.jpg`, ratio: t.r[k] })),
  }));
  const fromMuseum = window.COLLECTION.map(p => ({ ...p, slides: p.more ? [{ image: p.image, ratio: p.ratio }, ...p.more] : [{ image: p.image, video: p.video, poster: p.poster, ratio: p.ratio }] }));
  // Museum pieces first, then the Tumblr years; newest year first, original order within a year
  const items = [...fromMuseum, ...fromTumblr]
    .map((p, i) => ({ ...p, ratio: p.slides[0].ratio || 0.8, year: yearOf(p), i }))
    .sort((a, b) => (b.year - a.year) || (a.i - b.i));
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const select = document.getElementById('year');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Year options, newest first
  [...new Set(items.map(p => p.year).filter(Boolean))].sort((a, b) => b - a)
    .forEach(y => select.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`));

  // Filters live in the address (?year=2019&tag=kye) so a filtered view can be shared
  let tag = '';
  const norm = t => String(t || '').trim().toLowerCase();
  const chip = document.getElementById('tagchip');
  function readURL() {
    const q = new URLSearchParams(location.search);
    select.value = q.get('year') || '';
    if (select.value !== (q.get('year') || '')) select.value = '';
    tag = norm(q.get('tag'));
  }
  function writeURL(push) {
    const url = new URL(location.href);
    select.value ? url.searchParams.set('year', select.value) : url.searchParams.delete('year');
    tag ? url.searchParams.set('tag', tag) : url.searchParams.delete('tag');
    history[push ? 'pushState' : 'replaceState'](null, '', url);
  }
  function showChip() {
    chip.hidden = !tag;
    chip.innerHTML = tag ? `<span class="slash" aria-hidden="true">/</span><span>#${tag.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))}</span><button type="button" id="cleartag" aria-label="Clear tag filter">×</button>` : '';
    document.title = tag ? `#${tag}, archive` : 'archive';
    const clear = document.getElementById('cleartag');
    if (clear) clear.addEventListener('click', () => { tag = ''; writeURL(true); apply(); });
  }
  function apply(toTop) { showChip(); render(); if (toTop) scrollTo({ top: 0 }); }
  // Clicking a tag inside a photo filters right here
  window.onTagClick = t => { tag = norm(t); writeURL(true); apply(true); };
  addEventListener('popstate', () => { readURL(); apply(); });
  readURL();

  const label = p => [p.place, p.note, (p.tags || []).join(', ')].filter(Boolean).join('. ') || 'Artwork';
  const media = (m, big) => m.video
    ? `<video src="${m.video}" ${m.poster ? `poster="${m.poster}"` : ''} muted loop playsinline ${big ? 'controls' : 'autoplay aria-hidden="true"'}></video>`
    : `<img src="${big ? m.image : (m.thumb || m.image)}" alt="" loading="lazy" decoding="async">`;

  // As many ~175px columns as fit on desktop (at least 2; phones keep 2). Zooming the browser out makes more fit,
  // and columns also narrow a little as you zoom out, so at the smallest zoom the whole
  // archive fits on about one screen.
  const zoom = () => {
    const z = outerWidth && innerWidth ? outerWidth / innerWidth : 1;   // browser zoom on desktop
    return Math.min(1, Math.max(0.25, z));
  };
  const colCount = () => {
    const cs = getComputedStyle(grid), gap = parseFloat(cs.columnGap) || 20;
    const avail = grid.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const col = innerWidth > 600 ? 175 * (0.45 + 0.55 * zoom()) : 300;   // ~175px columns on desktop
    return Math.max(2, Math.floor((avail + gap) / (col + gap)));
  };

  function render() {
    const shown = items.filter(p => (!select.value || p.year === select.value) && (!tag || (p.tags || []).some(t => norm(t) === tag)));
    empty.hidden = shown.length > 0;
    const n = colCount();
    const cols = Array.from({ length: n }, () => ({ el: Object.assign(document.createElement('div'), { className: 'col' }), h: 0 }));
    shown.forEach(p => {
      const target = cols.reduce((a, b) => (b.h < a.h - 0.001 ? b : a));   // shortest column, leftmost on ties
      const btn = document.createElement('button');
      btn.className = 'tile'; btn.type = 'button';
      btn.style.setProperty('--ratio', p.ratio || 0.8);
      const n = p.slides.length;
      btn.setAttribute('aria-label', label(p) + (n > 1 ? `. ${n} photos` : '') + '. View up close');
      btn.innerHTML = media(p.slides[0]) + (n > 1 ? `<span class="count" aria-hidden="true">1/${n}</span>` : '');
      btn.addEventListener('click', () => openViewer(p));
      target.el.appendChild(btn);
      target.h += 1 / (p.ratio || 0.8);
    });
    grid.replaceChildren(...cols.map(c => c.el));
    // at very small sizes the photo-count chips are just specks, so hide them
    grid.classList.toggle('tiny', (cols[0].el.getBoundingClientRect().width * zoom()) < 110);
  }

  select.addEventListener('change', () => { writeURL(false); render(); });
  let lastN = colCount();
  addEventListener('resize', () => { if (colCount() !== lastN) { lastN = colCount(); render(); } });
  apply();

  // Show the navigation whenever the visitor scrolls up a little; hide it while scrolling down
  const bar = document.getElementById('bar');
  let lastY = scrollY, upBy = 0;
  addEventListener('scroll', () => {
    const y = scrollY, d = y - lastY; lastY = y;
    if (y < 80) { bar.classList.remove('away'); upBy = 0; return; }
    if (d > 0) { upBy = 0; if (!bar.contains(document.activeElement)) bar.classList.add('away'); }
    else if (d < 0) { upBy -= d; if (upBy > 24) bar.classList.remove('away'); }
  }, { passive: true });
  bar.addEventListener('focusin', () => bar.classList.remove('away'));

})();
</script>
</body>
</html>
