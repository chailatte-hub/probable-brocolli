<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>archive</title>
<meta name="description" content="Archive, Museum of Chai">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/museum.css">
<style>
  html, body { height: auto; overflow: auto; }
  body { background: #fff; }

  /* Tight masonry: columns filled in order, shortest first, so it reads newest to oldest */
  .grid {
    display: flex; align-items: flex-start;
    gap: clamp(10px, 1.6vw, 24px);
    padding: clamp(8px, 2vw, 24px) clamp(16px, 4vw, 56px) 64px;
  }
  .col { flex: 1; display: flex; flex-direction: column; gap: clamp(10px, 1.6vw, 24px); min-width: 0; }
  .tile {
    display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; background: #EEE;
    aspect-ratio: var(--ratio);
  }
  .tile > img, .tile > video {
    display: block; width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(1); transition: filter .4s ease;
  }
  .tile:hover > img, .tile:hover > video, .tile:focus-visible > img, .tile:focus-visible > video { filter: grayscale(0); }

  .tile { position: relative; }
  .tile .count {
    position: absolute; top: 8px; right: 8px;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(255,255,255,.88); color: var(--ink);
    font-size: 10px; letter-spacing: .04em; line-height: 1.2;
  }

  /* Viewer: swipe, arrow keys or the buttons to move through a post */
  .viewer { position: relative; display: grid; justify-items: center; gap: 10px; }
  .slides {
    width: var(--vw); height: var(--vh);
    display: flex; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slides:focus-visible { outline: none; }
  .slide { flex: 0 0 100%; height: 100%; margin: 0; scroll-snap-align: center; display: grid; place-items: center; }
  .slide > img, .slide > video { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
  .nav {
    position: absolute; top: calc(var(--vh) / 2); transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #000; background: rgba(255,255,255,.92); color: #000;
    display: grid; place-items: center; cursor: pointer;
  }
  .nav svg { width: 12px; height: 12px; }
  .nav.prev { left: -52px; } .nav.next { right: -52px; }
  .nav[disabled] { opacity: .2; cursor: default; }
  .where { font-size: 11px; color: var(--soft); letter-spacing: .04em; }
  @media (max-width: 720px) { .nav { display: none; } }

  .caption .tags { max-width: min(640px, 86vw); line-height: 1.7; color: var(--ink); text-wrap: balance; }
  .empty { padding: 0 clamp(16px, 4vw, 56px); color: var(--soft); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) { .tile > img, .tile > video { transition: none; } }
</style>
</head>
<body>
<header class="bar solid">
  <h1>Archive</h1>
  <nav class="tools" aria-label="Archive">
    <label class="year">
      <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filter by year</span>
      <select id="year"><option value="">All years</option></select>
    </label>
    <a href="./">Back to museum</a>
  </nav>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing from that year yet.</p>
</main>

<dialog id="closeup" aria-label="Artwork up close">
  <button class="close" type="button" id="close">Close</button>
  <div class="closeup" id="closeup-body"></div>
</dialog>

<script src="assets/collection.js"></script>
<script src="assets/tumblr.js"></script>
<script>
(() => {
  const yearOf = p => (String(p.place || '').match(/\d{4}/) || [''])[0];
  const fromTumblr = (window.TUMBLR || []).map(t => ({
    place: t.place, tags: t.tags,
    slides: t.f.map((f, k) => ({ image: `assets/archive/full/${f}.jpg`, thumb: `assets/archive/thumb/${f}.jpg`, ratio: t.r[k] })),
  }));
  const fromMuseum = window.COLLECTION.map(p => ({ ...p, slides: [{ image: p.image, video: p.video, poster: p.poster, ratio: p.ratio }] }));
  // Museum pieces first, then the Tumblr years; newest year first, original order within a year
  const items = [...fromMuseum, ...fromTumblr]
    .map((p, i) => ({ ...p, ratio: p.slides[0].ratio || 0.8, year: yearOf(p), i }))
    .sort((a, b) => (b.year - a.year) || (a.i - b.i));
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const select = document.getElementById('year');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Year options, newest first
  [...new Set(items.map(p => p.year).filter(Boolean))].sort((a, b) => b - a)
    .forEach(y => select.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`));

  // Remember ?year= in the address so a filtered view can be shared
  const params = new URLSearchParams(location.search);
  if (params.get('year')) select.value = params.get('year');

  const label = p => [p.place, p.note, (p.tags || []).join(', ')].filter(Boolean).join('. ') || 'Artwork';
  const media = (m, big) => m.video
    ? `<video src="${m.video}" ${m.poster ? `poster="${m.poster}"` : ''} muted loop playsinline ${big ? 'controls' : 'autoplay aria-hidden="true"'}></video>`
    : `<img src="${big ? m.image : (m.thumb || m.image)}" alt="" loading="lazy" decoding="async">`;

  const colCount = () => innerWidth < 600 ? 2 : innerWidth < 1000 ? 3 : 4;

  function render() {
    const shown = items.filter(p => !select.value || p.year === select.value);
    empty.hidden = shown.length > 0;
    const n = colCount();
    const cols = Array.from({ length: n }, () => ({ el: Object.assign(document.createElement('div'), { className: 'col' }), h: 0 }));
    shown.forEach(p => {
      const target = cols.reduce((a, b) => (b.h < a.h - 0.001 ? b : a));   // shortest column, leftmost on ties
      const btn = document.createElement('button');
      btn.className = 'tile'; btn.type = 'button';
      btn.style.setProperty('--ratio', p.ratio || 0.8);
      const n = p.slides.length;
      btn.setAttribute('aria-label', label(p) + (n > 1 ? `. ${n} photos` : '') + '. View up close');
      btn.innerHTML = media(p.slides[0]) + (n > 1 ? `<span class="count" aria-hidden="true">1/${n}</span>` : '');
      btn.addEventListener('click', () => open(p));
      target.el.appendChild(btn);
      target.h += 1 / (p.ratio || 0.8);
    });
    grid.replaceChildren(...cols.map(c => c.el));
  }

  select.addEventListener('change', () => {
    const url = new URL(location.href);
    select.value ? url.searchParams.set('year', select.value) : url.searchParams.delete('year');
    history.replaceState(null, '', url);
    render();
  });
  let lastN = colCount();
  addEventListener('resize', () => { if (colCount() !== lastN) { lastN = colCount(); render(); } });
  render();

  // Up close, in colour. Posts with several photos swipe sideways.
  const dlg = document.getElementById('closeup');
  const body = document.getElementById('closeup-body');
  const CHEV = d => `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
  let track = null, total = 1;
  function open(p) {
    const n = total = p.slides.length;
    const maxR = Math.max(...p.slides.map(m => m.ratio || 0.8));
    const caption = `<p class="caption">${p.note ? `<span class="t">${esc(p.note)}</span>` : ''}${p.tags && p.tags.length ? `<span class="tags">${p.tags.map(t => '#' + esc(t)).join(' ')}</span>` : ''}${p.place ? `<span class="h">${esc(p.place)}</span>` : ''}</p>`;
    body.innerHTML = `
      <div class="viewer" style="--vh:min(72svh, 900px);--vw:min(84vw, calc(min(72svh, 900px) * ${maxR}))">
        <div class="slides" id="slides" tabindex="0" aria-label="${n > 1 ? `${n} photos. Use arrow keys to move between them` : 'Photo'}">
          ${p.slides.map(m => `<figure class="slide">${media(m, true)}</figure>`).join('')}
        </div>
        ${n > 1 ? `
          <button class="nav prev" type="button" aria-label="Previous photo">${CHEV('M7.5 2 L3.5 6 L7.5 10')}</button>
          <button class="nav next" type="button" aria-label="Next photo">${CHEV('M4.5 2 L8.5 6 L4.5 10')}</button>
          <span class="where" aria-live="polite">1 / ${n}</span>` : ''}
      </div>
      ${caption}`;
    track = body.querySelector('#slides');
    if (n > 1) {
      const where = body.querySelector('.where'), prev = body.querySelector('.prev'), next = body.querySelector('.next');
      const update = () => {
        const k = Math.round(track.scrollLeft / track.clientWidth);
        where.textContent = `${k + 1} / ${n}`; prev.disabled = k === 0; next.disabled = k === n - 1;
      };
      track.addEventListener('scroll', update, { passive: true });
      prev.addEventListener('click', () => go(-1)); next.addEventListener('click', () => go(1));
      update();
    }
    const v = body.querySelector('video'); if (v && !reduce) v.play().catch(() => {});
    dlg.showModal();
    track.focus({ preventScroll: true });
  }
  function go(d) {
    if (!track) return;
    const k = Math.round(track.scrollLeft / track.clientWidth) + d;
    track.scrollTo({ left: Math.max(0, Math.min(total - 1, k)) * track.clientWidth, behavior: reduce ? 'auto' : 'smooth' });
  }
  dlg.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
  });
  document.getElementById('close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg || e.target === body || e.target.classList.contains('slide')) dlg.close(); });
  dlg.addEventListener('close', () => { body.innerHTML = ''; track = null; });
})();
</script>
</body>
</html>
